</ul></nav>
</div>
</header>
<main id="isi">
<div class="wrap halaman auth-halaman">
<h1>Masuk</h1>
<p class="intro">Masuk dengan username dan password yang kamu buat saat registrasi.</p>

<div class="auth-card">
<form class="auth-form" data-masuk novalidate>
<div class="auth-field">
<label class="auth-label" for="username">Username</label>
<input class="auth-input" id="username" name="username" type="text" autocomplete="username" required autocapitalize="none" spellcheck="false">
</div>
<div class="auth-field">
<label class="auth-label" for="password">Password</label>
<input class="auth-input" id="password" name="password" type="password" autocomplete="current-password" required>
</div>
<p class="auth-error" data-auth-error hidden role="alert"></p>
<button type="submit" class="btn btn-primary auth-submit">Masuk</button>
</form>
<p class="auth-foot">Belum punya akun? <a href="registrasi.html">Registrasi peserta terkurasi</a></p>
</div>
</div>
</main>
<footer>
<div class="wrap">
<p>Kelas Kreator. Program Creatifluencer, Pantau360 bersama Ekraf, 2026.</p>
</div>
</footer>
<script src="data/peserta-whitelist.js"></script>
<script src="auth.js"></script>
<script src="progress.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var next = params.get("next") || "progres.html";
  if (!/^[A-Za-z0-9_-][A-Za-z0-9_\/.-]*\.html(\?[^#]*)?$/.test(next)) next = "progres.html"; // a page on this site only
  if (window.kkAuth && kkAuth.currentUser()) {
    location.replace(next);
    return;
  }
  var form = document.querySelector("[data-masuk]");
  var err = document.querySelector("[data-auth-error]");
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    err.hidden = true;
    kkAuth.login(form.username.value, form.password.value).then(function (res) {
      if (!res.ok) {
        err.textContent = res.error;
        err.hidden = false;
        return;
      }
      location.href = next;
    });
  });
})();
</script>
</body>
</html>
